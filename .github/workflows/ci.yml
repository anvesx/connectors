name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm }
      - name: Build the shared contracts
        run: |
          git clone --depth 1 https://github.com/anvesx/company-brain.git ../company-brain
          cd ../company-brain
          pnpm install --frozen-lockfile --filter "@anvesx/connector-kit..."
          pnpm --filter @anvesx/core-types --filter @anvesx/connector-kit build
      - run: pnpm install --frozen-lockfile
      - run: pnpm structure
      - run: pnpm guard:fakes
      - run: pnpm exec biome check .
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to HEAD
