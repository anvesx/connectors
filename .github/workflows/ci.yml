name: ci
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 8.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: pnpm, registry-url: "https://npm.pkg.github.com", scope: "@anvesx" }
      - name: Fetch company-brain for the structure lint
        run: git clone --depth 1 https://github.com/anvesx/company-brain.git ../company-brain
      - run: pnpm install --frozen-lockfile
      - run: pnpm structure
      - run: pnpm guard:fakes
      - run: pnpm exec biome check .
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to HEAD
