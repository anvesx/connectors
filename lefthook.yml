commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,mjs,json}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    structure:
      run: pnpm structure
    fakes:
      run: pnpm guard:fakes
